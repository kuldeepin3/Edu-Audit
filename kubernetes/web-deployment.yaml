# EduAudit AI - Frontend (Next.js) Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduaudit-web
  namespace: eduaudit
  labels:
    app: eduaudit-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eduaudit-web
  template:
    metadata:
      labels:
        app: eduaudit-web
    spec:
      containers:
        - name: web
          image: ghcr.io/eduaudit/web:latest
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.eduaudit.gov.in"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.eduaudit.gov.in"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: eduaudit-web
  namespace: eduaudit
spec:
  selector:
    app: eduaudit-web
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
