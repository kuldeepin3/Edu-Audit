# EduAudit AI - Database (PostgreSQL + pgvector)
# For production: use managed RDS/CloudSQL. This is for self-hosted clusters.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eduaudit-db
  namespace: eduaudit
spec:
  serviceName: eduaudit-db
  replicas: 1
  selector:
    matchLabels:
      app: eduaudit-db
  template:
    metadata:
      labels:
        app: eduaudit-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: eduaudit-db-secret
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eduaudit-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eduaudit-db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eduaudit"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eduaudit-db
  namespace: eduaudit
spec:
  selector:
    app: eduaudit-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None  # Headless for StatefulSet
---
# Qdrant Vector DB StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eduaudit-qdrant
  namespace: eduaudit
spec:
  serviceName: eduaudit-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: eduaudit-qdrant
  template:
    metadata:
      labels:
        app: eduaudit-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.9.0
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eduaudit-qdrant
  namespace: eduaudit
spec:
  selector:
    app: eduaudit-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
  clusterIP: None
---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduaudit-redis
  namespace: eduaudit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eduaudit-redis
  template:
    metadata:
      labels:
        app: eduaudit-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: eduaudit-redis
  namespace: eduaudit
spec:
  selector:
    app: eduaudit-redis
  ports:
    - port: 6379
      targetPort: 6379
