# EduAudit AI - AI Worker (Celery) Deployment
# Handles CV inference, RAG, and fraud detection async tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduaudit-ai-worker
  namespace: eduaudit
  labels:
    app: eduaudit-ai-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eduaudit-ai-worker
  template:
    metadata:
      labels:
        app: eduaudit-ai-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/eduaudit/api:latest
          command: ["celery", "-A", "app.worker", "worker", "-l", "info", "-Q", "ai_priority,ai_standard", "--concurrency=2"]
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
              nvidia.com/gpu: 1
            limits:
              memory: "4Gi"
              cpu: "2000m"
              nvidia.com/gpu: 1
          envFrom:
            - secretRef:
                name: eduaudit-secrets
            - configMapRef:
                name: eduaudit-config
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: eduaudit-models-pvc
---
# AI Worker Autoscaler (CPU-based since GPU scaling is complex)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eduaudit-ai-worker-hpa
  namespace: eduaudit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eduaudit-ai-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# Celery Beat (Periodic tasks - health score updates, predictions)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduaudit-celery-beat
  namespace: eduaudit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eduaudit-celery-beat
  template:
    metadata:
      labels:
        app: eduaudit-celery-beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/eduaudit/api:latest
          command: ["celery", "-A", "app.worker", "beat", "-l", "info"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          envFrom:
            - secretRef:
                name: eduaudit-secrets
