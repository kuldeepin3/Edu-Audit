# EduAudit AI - Monitoring (Prometheus ServiceMonitor + Grafana)
# ServiceMonitor for scraping API metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: eduaudit-api-monitor
  namespace: eduaudit
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: eduaudit-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Pod Disruption Budget (ensure availability during node drains)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eduaudit-api-pdb
  namespace: eduaudit
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: eduaudit-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eduaudit-web-pdb
  namespace: eduaudit
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: eduaudit-web
---
# PostgreSQL Backup CronJob (daily)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eduaudit-db-backup
  namespace: eduaudit
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM IST
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: pgvector/pgvector:pg16
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: eduaudit-db-secret
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  DATE=$(date +%Y%m%d_%H%M%S)
                  pg_dump -h eduaudit-db -U eduaudit eduaudit | gzip > /backup/eduaudit_${DATE}.sql.gz
                  # Upload to S3
                  aws s3 cp /backup/eduaudit_${DATE}.sql.gz s3://eduaudit-backups/
                  # Delete backups older than 30 days
                  find /backup -name "eduaudit_*.sql.gz" -mtime +30 -delete
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
          restartPolicy: OnFailure
---
# Qdrant Snapshot CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eduaudit-qdrant-backup
  namespace: eduaudit
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: snapshot
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  curl -X POST http://eduaudit-qdrant:6333/collections/eduaudit_reports/snapshots
          restartPolicy: OnFailure
