# Download each Roboflow export as YOLOv11, unzip it locally, review its labels,
# then copy this file to unified_sources.yaml and use only verified mappings.
sources:
  - name: existing_school_data
    path: ../eduaudit_dataset
    data_yaml: data.yaml
    class_map:
      broken_toilet: broken_toilet
      damaged_wall: damaged_wall
      unsafe_wiring: unsafe_wiring

  # The supplied water dataset is labelled "Standing Water". Do NOT map it to
  # roof_leakage unless the individual images have been manually reviewed.
