# ==============================================================================
# EduAudit AI - Docker Compose (Development)
# ==============================================================================
version: '3.9'

x-common-env: &common-env
  DATABASE_URL: postgresql://eduaudit:eduaudit_secure_2026@db:5432/eduaudit
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  JWT_SECRET: dev-jwt-secret-change-in-production
  JWT_ALGORITHM: RS256
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  AWS_REGION: ap-south-1
  S3_BUCKET: eduaudit-media
  CLOUDINARY_URL: ${CLOUDINARY_URL:-}
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: 587
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG

services:
  # ==============================
  # Frontend - Next.js 14
  # ==============================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
    restart: unless-stopped

  # ==============================
  # Backend - FastAPI
  # ==============================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      <<: *common-env
      WORKERS: 4
      MODEL_PATH: /app/models/yolov11_nano.pt
    volumes:
      - ./backend/app:/app/app
      - ./cv_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==============================
  # AI Worker - Celery
  # ==============================
  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker worker -l info -Q ai_priority,ai_standard --concurrency=2
    environment:
      <<: *common-env
      MODEL_PATH: /app/models/yolov11_nano.pt
    volumes:
      - ./backend/app:/app/app
      - ./cv_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Celery Beat (Periodic tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *common-env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ==============================
  # PostgreSQL + pgvector + PostGIS
  # ==============================
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: eduaudit
      POSTGRES_USER: eduaudit
      POSTGRES_PASSWORD: eduaudit_secure_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduaudit -d eduaudit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================
  # Qdrant Vector Database
  # ==============================
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==============================
  # Redis (Cache + Queue)
  # ==============================
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==============================
  # MinIO (S3-compatible dev storage)
  # ==============================
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # ==============================
  # Nginx Reverse Proxy
  # ==============================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_storage:
  redis_data:
  minio_data:
